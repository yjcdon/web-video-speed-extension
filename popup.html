<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频长按加速倍率</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="heading">
        <div class="logo" aria-hidden="true"><img src="icons/icon.svg" alt=""></div>
        <div>
          <h1>长按加速倍率</h1>
          <p>长按右方向键 · 网页视频</p>
        </div>
      </div>

      <output id="speedOutput" for="speedSlider">3.00×</output>

      <input
        id="speedSlider"
        type="range"
        min="0.25"
        max="16"
        step="0.25"
        value="3"
        aria-label="长按加速倍率"
      >

      <div class="range-labels" aria-hidden="true">
        <span>0.25×</span>
        <span>16×</span>
      </div>

      <div class="presets" aria-label="常用倍率">
        <button type="button" data-speed="2">2×</button>
        <button type="button" data-speed="3">3×</button>
        <button type="button" data-speed="4">4×</button>
        <button type="button" data-speed="5">5×</button>
      </div>

    </main>
    <script src="popup.js"></script>
  </body>
</html>
